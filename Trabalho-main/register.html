<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte DALG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro</h1>

        <form id="register">

            <div class="input-box">
                <input type="text" id="name-register" placeholder="Nome" required>
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-box">
                <input type="email" id="email-register" placeholder="E-mail" required>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div class="input-box">
                <input type="text" id="cpf-register" placeholder="CPF" required>
                <i class="fa-solid fa-id-card"></i>
            </div>

            <div class="input-box">
                <input type="password" id="password" placeholder="Senha" required>
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="input-box">
                <input type="password" id="password-confirm" placeholder="Confirme sua senha" required>
            </div>

            <button type="button" id="enviar-banco-registro" class="login" onclick="confirm_pass()">Registrar</button>

        </form>

    </div>

    <script src="functions.js"></script>

</body>

</html>
