<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>

<body>
    <h1 class="h1-entrar">Log in</h1>
    <div class="div1-entrar">
        <form id="login">

            <label class="label1-entrar">Nome de Usuário:</label>
            <input class="input1-entrar" type="text" id="name"><br>

            <label class="label2-entrar">E-mail:</label>
            <input class="input2-entrar" type="text" id="email"><br>

            <label class="label3-entrar">Senha:</label>
            <input class="input3-entar" type="password" id="password-login"><br>

            <label class="label4-entrar">CPF:</label>
            <input class="input4-entar" type="text" id="cpf"><br>

            <label class="label5-entrar"></label>
            <input class="input5-entar" type="date" id="date"><br>
        </form>
        
    </div><br>
    <div class="div2">
        <button type="button" onclick="confirm_login()">Login</button>
        <label class="label6-entrar">Lembrar de mim:</label>
        <input type="checkbox" class="input6-entrar">
        <script src="fuctions.js"></script>
    </div>

</body>

</html>
